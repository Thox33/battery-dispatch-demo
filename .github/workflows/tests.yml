name: Tests
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the integration tests, reachable without a password.
      timescaledb:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_DB: battery_dispatch
          POSTGRES_USER: battery_dispatch
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battery_dispatch -d battery_dispatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Fail instead of skipping when the database is missing.
      BATTERY_DISPATCH_REQUIRE_DB: "1"
    steps:
      #----------------------------------------------
      #       check-out repo and set-up uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      #----------------------------------------------
      #             install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #              run build test
      #----------------------------------------------
      - name: Run build test
        run: uv build
      #----------------------------------------------
      #           run python test suite
      #----------------------------------------------
      - name: Run tests
        run: uv run pytest
