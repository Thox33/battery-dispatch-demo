[project]
name = "battery-dispatch-demo"
version = "0.1.0"
description = "Dispatch planning for a battery storage system against day-ahead electricity prices"
authors = [{ name = "Thorge Becker", email = "web@thorgebecker.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.148.0",
    "httpx2>=2.14.0",
    "pulp>=3.3,<4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
battery-dispatch = "battery_dispatch.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["battery_dispatch"]

# Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["battery_dispatch/storage/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["battery_dispatch"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# Pyright
[tool.pyright]
include = ["battery_dispatch", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["integration: needs a running TimescaleDB (docker compose up db)"]
filterwarnings = [
    # PuLP 3.3 announces API changes of PuLP 4, which is deliberately not used.
    'ignore:.*PuLP 4\.0:DeprecationWarning',
]
